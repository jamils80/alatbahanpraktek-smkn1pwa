<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventaris & Peminjaman Alat Bahan Praktek - SMKN 1 Purwoasri</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card-header { background-color: #0d6efd; color: white; }
    .nav-pills .nav-link.active { background-color: #0d6efd; }
    #qrReader { width: 100%; border-radius: 8px; overflow: hidden; }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      
      <div class="card shadow-sm mb-4">
        <div class="card-header text-center py-3">
          <h4 class="mb-0 fw-bold">Inventaris & Peminjaman Alat Bahan Praktek</h4>
          <small>SMK Negeri 1 Purwoasri</small>
        </div>
        
        <div class="card-body">

          <!-- Tab Navigasi Alat vs Bahan -->
          <ul class="nav nav-pills nav-justified mb-3" role="tablist">
            <li class="nav-item">
              <button class="nav-link active fw-bold" id="tab-alat" type="button" onclick="switchMode('Alat')">
                🔌 Peminjaman ALAT
              </button>
            </li>
            <li class="nav-item">
              <button class="nav-link fw-bold" id="tab-bahan" type="button" onclick="switchMode('Bahan')">
                📦 Pemakaian BAHAN
              </button>
            </li>
          </ul>

          <form id="formTransaksi" onsubmit="handleFormSubmit(event)">
            
            <!-- BAGIAN 1: SCAN QR BARANG -->
            <div class="mb-3 text-center p-3 bg-light rounded border">
              <label class="form-label fw-bold d-block text-primary" id="labelScanItem">1. Scan QR Code Alat</label>
              
              <button type="button" onclick="bukaKameraModal('item')" class="btn btn-primary w-100 py-2 fw-bold shadow-sm mb-2">
                📷 Buka Kamera Scan Alat / Bahan
              </button>
              
              <button class="btn btn-link btn-sm text-decoration-none fw-semibold p-0" type="button" onclick="toggleInputManual()">
                ✏️ Stiker QR Rusak? Pilih / Ketik Manual
              </button>
            </div>

            <!-- BAGIAN KHUSUS ALAT -->
            <div id="sectionAlat">
              <div id="containerManual" class="card card-body bg-light mb-3" style="display: none;">
                <label class="form-label fw-bold text-dark mb-1">Masukkan Kode Alat Manual</label>
                <div class="input-group">
                  <input type="text" class="form-control" id="inputKodeManual" placeholder="Contoh: ALT-001" autocomplete="off" oninput="handleManualInput(this.value)">
                  <button class="btn btn-warning fw-bold" type="button" onclick="cariManual()">Cari</button>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold d-block">Opsi Aksi Alat:</label>
                <div class="btn-group w-100" role="group">
                  <input type="radio" class="btn-check" name="tipeTransaksi" id="tipePinjam" value="Pinjam" checked>
                  <label class="btn btn-outline-primary fw-bold" for="tipePinjam">Peminjaman</label>

                  <input type="radio" class="btn-check" name="tipeTransaksi" id="tipeKembali" value="Kembali">
                  <label class="btn btn-outline-success fw-bold" for="tipeKembali">Pengembalian</label>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label fw-bold">Kode Alat</label>
                <input type="text" class="form-control" id="kodeItem" name="kodeItem" readonly placeholder="Otomatis dari QR / Manual">
              </div>
            </div>

            <!-- BAGIAN KHUSUS BAHAN -->
            <div id="sectionBahan" style="display: none;">
              <div class="mb-3">
                <label class="form-label fw-bold">Atau Pilih Bahan dari Daftar:</label>
                <select class="form-select" id="selectBahan" onchange="onBahanSelected()">
                  <option value="" selected disabled>-- Memuat Daftar Bahan... --</option>
                </select>
              </div>
            </div>

            <!-- DETAIL ITEM TERPILIH -->
            <div class="row g-2 mb-3">
              <div class="col-8">
                <label class="form-label fw-bold">Nama Item / Barang</label>
                <input type="text" class="form-control" id="namaItem" name="namaItem" readonly placeholder="Otomatis terisi">
              </div>
              <div class="col-4">
                <label class="form-label fw-bold">Stok</label>
                <input type="text" class="form-control" id="stokItem" readonly placeholder="-">
              </div>
            </div>

            <hr>

            <!-- BAGIAN 2: IDENTITAS PEMINJAM -->
            <div class="mb-3 p-3 bg-light rounded border">
              <div class="d-flex justify-content-between align-items-center mb-2">
                <label class="form-label fw-bold text-success mb-0">2. Identitas Murid Peminjam</label>
                <button type="button" onclick="bukaKameraModal('siswa')" class="btn btn-success btn-sm fw-bold shadow-sm">
                  🪪 Scan QR Kartu Siswa
                </button>
              </div>

              <div class="mb-2">
                <label class="form-label small fw-bold mb-1">Kelas:</label>
                <select class="form-select form-select-sm" id="kelas" name="kelas" required onchange="updateNamaDropdown()">
                  <option value="" selected disabled>-- Memuat Kelas... --</option>
                </select>
              </div>

              <div>
                <label class="form-label small fw-bold mb-1">Nama Siswa:</label>
                <select class="form-select form-select-sm" id="namaSiswa" name="namaSiswa" required disabled onchange="validateSubmitButton()">
                  <option value="" selected disabled>-- Pilih Kelas / Scan QR Siswa --</option>
                </select>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">3. Jumlah</label>
              <input type="number" class="form-control" id="jumlah" name="jumlah" min="1" value="1" required>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Keterangan (Opsional)</label>
              <input type="text" class="form-control" id="keterangan" name="keterangan" placeholder="Contoh: Praktikum Jaringan Dasar">
            </div>

            <div class="d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary py-3 fw-bold" onclick="resetSeluruhForm()">🔄 Reset</button>
              <button type="submit" class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm" id="btnSubmit" disabled>Simpan Transaksi</button>
            </div>
          </form>

          <div id="alertBox" class="mt-3"></div>

        </div>
      </div>

    </div>
  </div>
</div>

<!-- MODAL KAMERA SCANNER LANGSUNG -->
<div class="modal fade" id="scannerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="scannerModalTitle">📷 Scan QR Code</h5>
        <button type="button" class="btn-close btn-close-white" onclick="tutupKameraModal()"></button>
      </div>
      <div class="modal-body text-center bg-light">
        <div id="qrReader"></div>
        <small class="text-muted d-block mt-2">Arahkan kamera ke stiker QR Code</small>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // TEMPELKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI (/exec)
  const GAS_API_URL = "https://script.google.com/macros/s/GANTI_DENGAN_ID_DEPLOYMENT_ANDA/exec";

  let activeMode = 'Alat';
  let dataSiswaByKelas = {};
  let listBahan = [];
  let typingTimer;
  let scannerModal;
  let html5QrCode;
  let currentScanTarget = 'item';

  window.onload = function() {
    scannerModal = new bootstrap.Modal(document.getElementById('scannerModal'));
    loadInitialData();
  };

  // MEMUAT DATA AWAL DARI GOOGLE SHEETS VIA API
  async function loadInitialData() {
    showAlert('⏳ Menghubungkan ke database Google Sheets...', 'info');
    try {
      const response = await fetch(`${GAS_API_URL}?action=getInitData`);
      const res = await response.json();
      if (res.success) {
        dataSiswaByKelas = res.siswa || {};
        listBahan = res.bahan || [];
        renderDropdownKelas();
        renderDropdownBahan();
        document.getElementById('alertBox').innerHTML = '';
      } else {
        showAlert('Gagal memuat data awal: ' + res.message, 'danger');
      }
    } catch (err) {
      showAlert('❌ Gagal terhubung ke server Apps Script. Pastikan URL API benar.', 'danger');
    }
  }

  function renderDropdownKelas() {
    const kelasSelect = document.getElementById('kelas');
    kelasSelect.innerHTML = '<option value="" selected disabled>-- Pilih Kelas --</option>';
    Object.keys(dataSiswaByKelas).forEach(kelas => {
      let opt = document.createElement('option');
      opt.value = kelas;
      opt.textContent = kelas;
      kelasSelect.appendChild(opt);
    });
  }

  function renderDropdownBahan() {
    const select = document.getElementById('selectBahan');
    select.innerHTML = '<option value="" selected disabled>-- Pilih Bahan --</option>';
    listBahan.forEach(item => {
      let opt = document.createElement('option');
      opt.value = item.id;
      opt.textContent = `${item.nama} (Stok: ${item.stok} ${item.satuan})`;
      select.appendChild(opt);
    });
  }

  // KAMERA POPUP LANGSUNG DI GITHUB
  function bukaKameraModal(target) {
    currentScanTarget = target;
    document.getElementById('scannerModalTitle').innerText = 
      target === 'siswa' ? '🪪 Scan QR Kartu Pelajar' : '📦 Scan QR Alat / Bahan';
    
    scannerModal.show();

    setTimeout(() => {
      html5QrCode = new Html5Qrcode("qrReader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          tutupKameraModal();
          prosesHasilScan(decodedText.trim(), target);
        },
        (errorMessage) => {}
      ).catch(err => {
        alert("Gagal mengakses kamera: " + err);
        tutupKameraModal();
      });
    }, 400);
  }

  function tutupKameraModal() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
    }
    scannerModal.hide();
  }

  function prosesHasilScan(kode, target) {
    if (target === 'siswa') {
      fetchSiswaData(kode);
    } else {
      if (activeMode === 'Bahan' || kode.toUpperCase().startsWith('BHN')) {
        if (activeMode !== 'Bahan') switchMode('Bahan', false);
        fetchBahanData(kode);
      } else {
        if (activeMode !== 'Alat') switchMode('Alat', false);
        document.getElementById('kodeItem').value = kode;
        fetchAlatData(kode);
      }
    }
  }

  async function fetchAlatData(kode) {
    if (!kode) return;
    showAlert('⏳ Mengambil data alat...', 'info');
    try {
      const response = await fetch(`${GAS_API_URL}?action=getAlat&kode=${encodeURIComponent(kode)}`);
      const res = await response.json();
      if (res.success) {
        document.getElementById('namaItem').value = res.nama;
        document.getElementById('stokItem').value = `${res.stok} (${res.kondisi})`;
        showAlert('✅ Alat Terdeteksi: ' + res.nama, 'success');
      } else {
        document.getElementById('namaItem').value = '';
        document.getElementById('stokItem').value = '-';
        showAlert(res.message, 'danger');
      }
    } catch (e) {
      showAlert('Error koneksi saat mencari alat.', 'danger');
    }
    validateSubmitButton();
  }

  async function fetchBahanData(kode) {
    if (!kode) return;
    showAlert('⏳ Mengambil data bahan...', 'info');
    try {
      const response = await fetch(`${GAS_API_URL}?action=getBahan&kode=${encodeURIComponent(kode)}`);
      const res = await response.json();
      if (res.success) {
        document.getElementById('selectBahan').value = res.id;
        document.getElementById('namaItem').value = res.nama;
        document.getElementById('stokItem').value = `${res.stok} ${res.satuan}`;
        showAlert('✅ Bahan Terdeteksi: ' + res.nama, 'success');
      } else {
        showAlert(res.message, 'danger');
      }
    } catch (e) {
      showAlert('Error koneksi saat mencari bahan.', 'danger');
    }
    validateSubmitButton();
  }

  async function fetchSiswaData(kode) {
    if (!kode) return;
    showAlert('⏳ Mencari identitas siswa...', 'info');
    try {
      const response = await fetch(`${GAS_API_URL}?action=getSiswa&kode=${encodeURIComponent(kode)}`);
      const res = await response.json();
      if (res.success) {
        document.getElementById('kelas').value = res.kelas;
        updateNamaDropdown(res.nama);
        showAlert(`✅ Siswa Terdeteksi: ${res.nama} (${res.kelas})`, 'success');
      } else {
        showAlert(res.message, 'danger');
      }
    } catch (e) {
      showAlert('Error koneksi saat mencari siswa.', 'danger');
    }
    validateSubmitButton();
  }

  function resetSeluruhForm() {
    document.getElementById('formTransaksi').reset();
    document.getElementById('namaItem').value = '';
    document.getElementById('stokItem').value = '-';
    document.getElementById('kodeItem').value = '';
    document.getElementById('namaSiswa').disabled = true;
    document.getElementById('btnSubmit').disabled = true;
    document.getElementById('alertBox').innerHTML = '';
  }

  function switchMode(mode, clearData = true) {
    activeMode = mode;
    if (clearData) resetSeluruhForm();
    document.getElementById('containerManual').style.display = 'none';

    if (mode === 'Alat') {
      document.getElementById('labelScanItem').innerText = '1. Scan QR Code Alat';
      document.getElementById('sectionAlat').style.display = 'block';
      document.getElementById('sectionBahan').style.display = 'none';
      document.getElementById('tab-alat').classList.add('active');
      document.getElementById('tab-bahan').classList.remove('active');
    } else {
      document.getElementById('labelScanItem').innerText = '1. Scan QR Code Bahan Praktek';
      document.getElementById('sectionAlat').style.display = 'none';
      document.getElementById('sectionBahan').style.display = 'block';
      document.getElementById('tab-bahan').classList.add('active');
      document.getElementById('tab-alat').classList.remove('active');
    }
  }

  function toggleInputManual() {
    const box = document.getElementById('containerManual');
    const mainInput = document.getElementById('kodeItem');
    const isHidden = box.style.display === 'none';

    if (isHidden) {
      box.style.display = 'block';
      mainInput.removeAttribute('readonly');
      document.getElementById('inputKodeManual').focus();
    } else {
      box.style.display = 'none';
      mainInput.setAttribute('readonly', true);
    }
  }

  function handleManualInput(val) {
    const cleanCode = val.trim();
    document.getElementById('kodeItem').value = cleanCode;
    clearTimeout(typingTimer);

    if (cleanCode.length >= 3) {
      typingTimer = setTimeout(() => fetchAlatData(cleanCode), 500);
    } else {
      document.getElementById('namaItem').value = '';
      document.getElementById('stokItem').value = '-';
      validateSubmitButton();
    }
  }

  function cariManual() {
    const kode = document.getElementById('inputKodeManual').value.trim();
    if (kode !== '') {
      document.getElementById('kodeItem').value = kode;
      fetchAlatData(kode);
    }
  }

  function onBahanSelected() {
    const selectedId = document.getElementById('selectBahan').value;
    const bahan = listBahan.find(b => b.id === selectedId);
    if (bahan) {
      document.getElementById('namaItem').value = bahan.nama;
      document.getElementById('stokItem').value = `${bahan.stok} ${bahan.satuan}`;
    }
    validateSubmitButton();
  }

  function updateNamaDropdown(autoSelectNama = null) {
    const kelasTerpilih = document.getElementById('kelas').value;
    const namaSelect = document.getElementById('namaSiswa');
    namaSelect.innerHTML = '<option value="" selected disabled>-- Pilih Nama Siswa --</option>';
    
    if (dataSiswaByKelas[kelasTerpilih]) {
      dataSiswaByKelas[kelasTerpilih].forEach(nama => {
        let opt = document.createElement('option');
        opt.value = nama;
        opt.textContent = nama;
        namaSelect.appendChild(opt);
      });
      namaSelect.disabled = false;
      if (autoSelectNama) namaSelect.value = autoSelectNama;
    } else {
      namaSelect.disabled = true;
    }
    validateSubmitButton();
  }

  function validateSubmitButton() {
    const hasItem = document.getElementById('namaItem').value.trim() !== '';
    const hasSiswa = document.getElementById('namaSiswa').value !== '';
    document.getElementById('btnSubmit').disabled = !(hasItem && hasSiswa);
  }

  async function handleFormSubmit(event) {
    event.preventDefault();
    document.getElementById('btnSubmit').disabled = true;
    showAlert('⏳ Menyimpan transaksi ke Google Sheets...', 'info');

    const formObj = {
      jenisItem: activeMode,
      tipeTransaksi: activeMode === 'Alat' ? document.querySelector('input[name="tipeTransaksi"]:checked').value : 'Pakai',
      kodeItem: document.getElementById('kodeItem').value,
      idBahan: document.getElementById('selectBahan').value,
      namaItem: document.getElementById('namaItem').value,
      kelas: document.getElementById('kelas').value,
      namaSiswa: document.getElementById('namaSiswa').value,
      jumlah: document.getElementById('jumlah').value,
      keterangan: document.getElementById('keterangan').value
    };

    try {
      const response = await fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(formObj)
      });
      const res = await response.json();
      
      if (res.success) {
        resetSeluruhForm();
        showAlert('✅ ' + res.message, 'success');
        loadInitialData(); // Perbarui stok terbaru
      } else {
        showAlert('❌ ' + res.message, 'danger');
        document.getElementById('btnSubmit').disabled = false;
      }
    } catch (err) {
      showAlert('❌ Gagal mengirim transaksi ke server.', 'danger');
      document.getElementById('btnSubmit').disabled = false;
    }
  }

  function showAlert(msg, type) {
    document.getElementById('alertBox').innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">${msg}</div>`;
  }
</script>
</body>
</html>

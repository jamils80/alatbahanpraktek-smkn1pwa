<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR - Lab SMKN 1 Purwoasri</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { background-color: #121212; color: white; font-family: sans-serif; }
    #reader { width: 100%; max-width: 450px; margin: auto; border-radius: 12px; overflow: hidden; }
  </style>
</head>
<body class="d-flex flex-column justify-content-center align-items-center min-vh-100 p-3">

  <div class="text-center mb-3">
    <h5 class="fw-bold text-info" id="scanTitle">📷 Pemindai QR Code</h5>
    <p class="small text-secondary mb-0">Arahkan kamera ke stiker QR Alat/Bahan atau Kartu Siswa</p>
  </div>

  <div id="reader" class="shadow-lg border border-secondary"></div>

  <button class="btn btn-outline-light mt-4 px-4" onclick="batalScan()">❌ Batal & Kembali</button>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect_url');
    const target = urlParams.get('target') || 'item'; // 'item' atau 'siswa'

    if (target === 'siswa') {
      document.getElementById('scanTitle').innerText = "🪪 Scan QR Kartu Pelajar / Siswa";
    } else {
      document.getElementById('scanTitle').innerText = "📦 Scan QR Alat / Bahan Praktek";
    }

    function onScanSuccess(decodedText) {
      html5QrcodeScanner.clear();
      if (redirectUrl) {
        const finalUrl = new URL(redirectUrl);
        finalUrl.searchParams.set('kode', decodedText.trim());
        finalUrl.searchParams.set('target', target);
        window.location.href = finalUrl.toString();
      } else {
        alert("Hasil Scan (" + target + "): " + decodedText);
      }
    }

    function batalScan() {
      if (redirectUrl) {
        window.location.href = redirectUrl;
      } else {
        window.history.back();
      }
    }

    let html5QrcodeScanner = new Html5QrcodeScanner(
      "reader", 
      { fps: 10, qrbox: { width: 250, height: 250 }, rememberLastUsedCamera: true },
      false
    );
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
